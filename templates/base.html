{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Главная{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<header>
    <nav>
        <a href="/">Главная</a>
        {% if user.is_authenticated %}
            {% if user.is_superuser is True %}
                <a href="{% url 'group_list' %}">Список групп</a>
                <a href="{% url 'user_list' %}">Список пользователей</a>
                <a href="{% url 'database_list' %}">Список баз данных</a>
                <a href="{% url 'settings_info' %}">Настройки</a>
            {% endif %}
            <a href="{% url 'logout' %}">Выйти</a>
        {% else %}
            <a href="{% url 'login' %}">Войти</a>
            <a href="{% url 'register' %}">Регистрация</a>
        {% endif %}
    </nav>
</header>

<main>
    {% block content %}
    <button id="getWindowsUser">Получить пользователя Windows</button>
    <p id="windowsUser"></p>

    <script>
        document.getElementById("getWindowsUser").addEventListener("click", function() {
            fetch("{% url 'get_windows_user' %}")
            .then(response => response.json())
            .then(data => {
                document.getElementById("windowsUser").innerText = "Пользователь Windows: " + data.username;
            })
            .catch(error => console.error("Ошибка:", error));
        });
    </script>
    {% endblock %}
</main>
</body>
</html>
