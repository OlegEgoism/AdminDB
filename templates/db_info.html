<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #6366f1;
            --primary-dark: #4338ca;
            --secondary: #6b7280;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --glass: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(209, 213, 219, 0.5);
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-primary);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .dashboard {
            max-width: 1600px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
        }

        /* Header */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 30px;
            background: white;
            border-radius: 20px;
            border: 1px solid var(--gray-200);
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
        }

        .dashboard-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
        }

        .header-content h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--gray-800);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-content p {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .header-actions {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
            font-size: 15px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.2);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.3);
        }

        .btn-ghost {
            background: transparent;
            color: var(--gray-700);
            border: 1px solid var(--gray-300);
        }

        .btn-ghost:hover {
            background: var(--gray-50);
            border-color: var(--gray-400);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-outline:hover {
            background: rgba(79, 70, 229, 0.1);
            transform: translateY(-2px);
        }

        /* Stats Overview */
        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            border-radius: 18px;
            padding: 24px;
            border: 1px solid var(--gray-200);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-light), var(--primary));
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-light);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        .stat-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-text h3 {
            font-size: 36px;
            font-weight: 800;
            color: var(--gray-800);
            margin-bottom: 4px;
        }

        .stat-text p {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        .stat-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.2);
        }

        /* Connections Section */
        .connections-section {
            background: white;
            border-radius: 20px;
            border: 1px solid var(--gray-200);
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .section-title-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--gray-800);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .connections-count {
            background: var(--primary);
            color: white;
            font-size: 14px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            min-width: 30px;
            text-align: center;
        }

        .section-header h2::before {
            content: '';
            width: 4px;
            height: 24px;
            background: var(--primary);
            border-radius: 2px;
        }

        .section-controls {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .section-search-bar {
            position: relative;
            min-width: 300px;
        }

        .section-search-bar input {
            padding: 12px 16px 12px 44px;
            background: var(--gray-50);
            border: 1px solid var(--gray-300);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 15px;
            width: 100%;
            transition: all 0.3s ease;
        }

        .section-search-bar input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .section-search-bar i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
        }

        .filters-container {
            margin-bottom: 30px;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            background: var(--gray-100);
            padding: 6px;
            border-radius: 12px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 10px 20px;
            border: none;
            background: transparent;
            color: var(--gray-600);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .tab.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .create-btn-container {
            margin-left: auto;
        }

        /* Connections Grid */
        .connections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .connection-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            border: 1px solid var(--gray-200);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }

        .connection-card:hover {
            border-color: var(--primary-light);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        .card-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .card-badge.development {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .db-avatar {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            flex-shrink: 0;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.2);
            position: relative;
        }

        .db-avatar::after {
            content: '';
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 12px;
            height: 12px;
            background: var(--success);
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .db-avatar.offline::after {
            background: var(--danger);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        .db-avatar.slow::after {
            background: var(--warning);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }

        .db-info h3 {
            font-size: 20px;
            font-weight: 700;
            color: var(--gray-800);
            margin-bottom: 4px;
        }

        .db-info p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .card-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .detail-label {
            font-size: 12px;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .detail-value {
            font-size: 14px;
            font-weight: 500;
            color: var(--gray-800);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-value i {
            color: var(--primary);
            width: 16px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid var(--gray-200);
        }

        .connection-stats {
            display: flex;
            gap: 20px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--gray-800);
        }

        .stat-label {
            font-size: 12px;
            color: var(--gray-500);
            font-weight: 500;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .action-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid var(--gray-300);
            background: var(--gray-50);
            color: var(--gray-600);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .action-btn.delete:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        .favorite-action-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--gray-400);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .favorite-action-btn:hover {
            color: var(--warning);
            transform: scale(1.2);
        }

        .favorite-action-btn.active {
            color: var(--warning);
        }

        /* Footer */
        .dashboard-footer {
            background: white;
            border-radius: 20px;
            border: 1px solid var(--gray-200);
            padding: 24px 30px;
            margin-top: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .footer-links {
            display: flex;
            gap: 24px;
        }

        .footer-links a {
            color: var(--gray-600);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .footer-links a:hover {
            color: var(--primary);
            transform: translateY(-1px);
        }

        .footer-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-weight: 600;
            color: var(--gray-800);
            font-size: 14px;
        }

        .user-role {
            font-size: 12px;
            color: var(--gray-500);
            font-weight: 500;
        }

        /* Animations */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .connection-card {
            animation: slideUp 0.5s ease-out forwards;
            opacity: 0;
        }

        .connection-card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .connection-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .connection-card:nth-child(3) {
            animation-delay: 0.3s;
        }

        .connection-card:nth-child(4) {
            animation-delay: 0.4s;
        }

        .connection-card:nth-child(5) {
            animation-delay: 0.5s;
        }

        /* Status Indicator */
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .status-indicator::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .connections-grid {
                grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .connections-grid {
                grid-template-columns: 1fr;
            }

            .dashboard-header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            .header-actions {
                flex-direction: column;
                width: 100%;
            }

            .section-header {
                flex-direction: column;
                align-items: stretch;
            }

            .section-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .section-search-bar {
                min-width: 100%;
            }

            .create-btn-container {
                margin-left: 0;
                width: 100%;
            }

            .create-btn-container .btn {
                width: 100%;
            }

            .card-details {
                grid-template-columns: 1fr;
            }

            .card-footer {
                flex-direction: column;
                gap: 20px;
                align-items: stretch;
            }

            .connection-stats {
                justify-content: space-between;
            }

            .card-actions {
                justify-content: center;
            }

            .footer-content {
                flex-direction: column;
                gap: 24px;
                text-align: center;
            }

            .footer-left {
                flex-direction: column;
                gap: 20px;
            }

            .footer-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 16px;
            }

            .footer-right {
                flex-direction: column;
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .dashboard-header, .connections-section, .dashboard-footer {
                padding: 20px;
            }

            .filter-tabs {
                flex-wrap: wrap;
                width: 100%;
            }

            .tab {
                flex: 1;
                min-width: 120px;
            }

            .header-actions {
                flex-wrap: wrap;
            }

            .btn {
                padding: 10px 16px;
                font-size: 14px;
            }

            .connection-stats {
                flex-direction: column;
                gap: 10px;
            }

            .card-actions {
                justify-content: space-between;
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <header class="dashboard-header">
        <div class="header-content">
            <h1><i class="fas fa-database" style="color: var(--primary);"></i> Database Hub</h1>
            <p>Центр управления подключениями к базам данных</p>
        </div>
        <div class="header-actions">
            <button class="btn btn-ghost">
                <i class="fas fa-clipboard-list"></i> Аудит
            </button>
            <button class="btn btn-ghost">
                <i class="fas fa-cog"></i> Настройки
            </button>
            <button class="btn btn-ghost">
                <i class="fas fa-user-plus"></i> Регистрация
            </button>
            <button class="btn btn-outline">
                <i class="fas fa-sign-in-alt"></i> Вход
            </button>
        </div>
    </header>

    <section class="connections-section">
        <div class="section-header">
            <div class="section-title-container">
                <h2>Активные подключения</h2>
                <div class="connections-count" id="connectionsCount">0</div>
            </div>
            <div class="section-controls">
                <div class="section-search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Поиск подключений...">
                </div>
                <div class="create-btn-container">
                    <button class="btn btn-primary" id="newConnection">
                        <i class="fas fa-plus"></i> Создать подключение
                    </button>
                </div>
            </div>
        </div>

        <div class="filters-container">
            <div class="filter-tabs">
                <button class="tab active" data-filter="all">Все</button>
                <button class="tab" data-filter="production">Продакшн</button>
                <button class="tab" data-filter="development">Разработка</button>
                <button class="tab" data-filter="mysql">MySQL</button>
                <button class="tab" data-filter="favorites">Избранные</button>
            </div>
        </div>

        <div class="connections-grid" id="connectionsGrid">
            <!-- Connections will be loaded here -->
        </div>
    </section>

    <footer class="dashboard-footer">
        <div class="footer-content">
            <div class="footer-left">
                <div class="copyright">
                    <p style="color: var(--gray-600); font-size: 14px; font-weight: 500;">
                        <i class="far fa-copyright"></i> 2023 Database Hub v2.1
                    </p>
                </div>
                <div class="footer-links">
                    <a href="#"><i class="fas fa-shield-alt"></i> Безопасность</a>
                    <a href="#"><i class="fas fa-question-circle"></i> Помощь</a>
                    <a href="#"><i class="fas fa-book"></i> Документация</a>
                    <a href="#"><i class="fas fa-envelope"></i> Контакты</a>
                </div>
            </div>
        </div>
    </footer>
</div>

            username: "backup_admin",
            status: "active",
            lastUsed: "2023-10-16T11:45:00",
            responseTime: "32ms",
            environment: "production",
            uptime: "99.9%",
            connections: 156,
            isFavorite: false,
            connectionStatus: "online"
        }
    ];

    function getDbIcon(type) {
        const icons = {
            'MySQL': 'fas fa-database',
            'PostgreSQL': 'fas fa-database',
            'MongoDB': 'fas fa-leaf',
            'Redis': 'fas fa-bolt',
            'Oracle': 'fas fa-server'
        };
        return icons[type] || 'fas fa-database';
    }

    function formatDate(dateString) {
        const date = new Date(dateString);
        const now = new Date();
        const diffMs = now - date;
        const diffMins = Math.floor(diffMs / 60000);

        if (diffMins < 1) return 'Только что';
        if (diffMins < 60) return `${diffMins} мин назад`;

        const diffHours = Math.floor(diffMins / 60);
        if (diffHours < 24) return `${diffHours} ч назад`;

        return date.toLocaleDateString('ru-RU', {
            day: '2-digit',
            month: 'short'
        });
    }

    function updateConnectionsCount(filteredConnections) {
        const countElement = document.getElementById('connectionsCount');
        countElement.textContent = filteredConnections.length;
    }

    function getStatusClass(connectionStatus) {
        switch (connectionStatus) {
            case 'online': return '';
            case 'offline': return 'offline';
            case 'slow': return 'slow';
            default: return '';
        }
    }

    function getStatusText(connectionStatus) {
        switch (connectionStatus) {
            case 'online': return 'В сети';
            case 'offline': return 'Отключено';
            case 'slow': return 'Медленно';
            default: return 'Неизвестно';
        }
    }

    function toggleFavorite(connectionId) {
        const connection = connections.find(c => c.id === connectionId);
        if (connection) {
            connection.isFavorite = !connection.isFavorite;
            const currentFilter = document.querySelector('.tab.active').dataset.filter;
            renderConnections(currentFilter);
        }
    }

    function renderConnections(filter = 'all') {
        const grid = document.getElementById('connectionsGrid');

        let filtered = connections;
        if (filter === 'production') filtered = connections.filter(c => c.environment === 'production');
        if (filter === 'development') filtered = connections.filter(c => c.environment === 'development');
        if (filter === 'mysql') filtered = connections.filter(c => c.type === 'MySQL');
        if (filter === 'favorites') filtered = connections.filter(c => c.isFavorite);

        updateConnectionsCount(filtered);

        grid.innerHTML = filtered.map(conn => `
            <div class="connection-card">
                <div class="card-badge ${conn.environment === 'production' ? '' : 'development'}">
                    ${conn.environment === 'production' ? 'PRODUCTION' : 'DEVELOPMENT'}
                </div>

                <div class="card-header">
                    <div class="db-avatar ${getStatusClass(conn.connectionStatus)}">
                        <i class="${getDbIcon(conn.type)}"></i>
                    </div>
                    <div class="db-info">
                        <h3>${conn.name}</h3>
                        <p>${conn.type} • ${conn.host}</p>
                    </div>
                </div>

                <div class="card-details">
                    <div class="detail-item">
                        <span class="detail-label">Статус подключения</span>
                        <span class="detail-value">
                            <i class="fas fa-circle" style="color: ${conn.connectionStatus === 'online' ? 'var(--success)' : conn.connectionStatus === 'offline' ? 'var(--danger)' : 'var(--warning)'}"></i>
                            ${getStatusText(conn.connectionStatus)}
                        </span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">База данных</span>
                        <span class="detail-value">
                            <i class="fas fa-database"></i>
                            ${conn.database}
                        </span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Пользователь</span>
                        <span class="detail-value">
                            <i class="fas fa-user"></i>
                            ${conn.username}
                        </span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Порт</span>
                        <span class="detail-value">
                            <i class="fas fa-plug"></i>
                            ${conn.port}
                        </span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Использовано</span>
                        <span class="detail-value">
                            <i class="fas fa-history"></i>
                            ${formatDate(conn.lastUsed)}
                        </span>
                    </div>
                </div>

                <div class="card-footer">
                    <div class="connection-stats">
                        <div class="stat-item">
                            <div class="stat-value">${conn.responseTime}</div>
                            <div class="stat-label">Время ответа</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${conn.uptime}</div>
                            <div class="stat-label">Доступность</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${conn.connections}</div>
                            <div class="stat-label">Подключений</div>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="favorite-action-btn ${conn.isFavorite ? 'active' : ''}" onclick="toggleFavorite(${conn.id})" title="${conn.isFavorite ? 'Убрать из избранного' : 'Добавить в избранное'}">
                            <i class="${conn.isFavorite ? 'fas' : 'far'} fa-star"></i>
                        </button>
                        <button class="action-btn" onclick="pingConnection(${conn.id})" title="Проверить">
                            <i class="fas fa-satellite-dish"></i>
                        </button>
                        <button class="action-btn" onclick="monitorConnection(${conn.id})" title="Мониторинг">
                            <i class="fas fa-chart-bar"></i>
                        </button>
                        <button class="action-btn delete" onclick="removeConnection(${conn.id})" title="Удалить">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function setupTabs() {
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function () {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                renderConnections(this.dataset.filter);
            });
        });
    }

    function pingConnection(id) {
        const conn = connections.find(c => c.id === id);
        const responseTime = Math.floor(Math.random() * 50) + 10;
        alert(`📡 Пинг подключения "${conn.name}"\n\nРезультат: Успешно\nВремя ответа: ${responseTime}ms\nСтатус: ${getStatusText(conn.connectionStatus)}\nДоступность: ${conn.uptime}`);
    }

    function monitorConnection(id) {
        const conn = connections.find(c => c.id === id);
        alert(`📊 Мониторинг подключения "${conn.name}"\n\nАктивных подключений: ${conn.connections}\nЗагрузка ЦП: ${Math.floor(Math.random() * 30) + 5}%\nИспользование памяти: ${Math.floor(Math.random() * 40) + 10}%\nОпераций в сек: ${Math.floor(Math.random() * 5000) + 1000}`);
    }

    function removeConnection(id) {
        if (confirm('Вы уверены, что хотите удалить это подключение?')) {
            const index = connections.findIndex(c => c.id === id);
            if (index !== -1) {
                connections.splice(index, 1);
                const currentFilter = document.querySelector('.tab.active').dataset.filter;
                renderConnections(currentFilter);
                alert(`Подключение удалено из системы.`);
            }
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderConnections();
        setupTabs();

        document.getElementById('newConnection').addEventListener('click', () => {
            alert('🆕 Создание нового подключения\n\nВыберите тип базы данных и настройте параметры подключения.');
        });

        // Обработчики для кнопок хедера
        document.querySelector('.btn-outline').addEventListener('click', () => {
            alert('🔐 Вход в систему\n\nВведите ваши учетные данные для доступа к Database Hub.');
        });

        document.querySelectorAll('.btn-ghost').forEach(btn => {
            const icon = btn.querySelector('i').className;
            if (icon.includes('user-plus')) {
                btn.addEventListener('click', () => {
                    alert('📝 Регистрация\n\nСоздайте новый аккаунт для доступа к системе управления базами данных.');
                });
            } else if (icon.includes('clipboard-list')) {
                btn.addEventListener('click', () => {
                    alert('📋 Аудит системы\n\nПросмотр логов и истории действий в системе.');
                });
            } else if (icon.includes('cog')) {
                btn.addEventListener('click', () => {
                    alert('⚙️ Настройки\n\nНастройте параметры системы, уведомления и внешний вид.');
                });
            }
        });

        const searchInput = document.querySelector('.section-search-bar input');
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const searchTerm = e.target.value.toLowerCase();
                const filtered = connections.filter(conn =>
                    conn.name.toLowerCase().includes(searchTerm) ||
                    conn.type.toLowerCase().includes(searchTerm) ||
                    conn.host.toLowerCase().includes(searchTerm)
                );

                if (filtered.length === 0) {
                    alert(`🔍 Поиск: "${e.target.value}"\n\nНичего не найдено.`);
                } else {
                    const currentFilter = document.querySelector('.tab.active').dataset.filter;
                    let displayed = filtered;
                    if (currentFilter === 'production') displayed = filtered.filter(c => c.environment === 'production');
                    if (currentFilter === 'development') displayed = filtered.filter(c => c.environment === 'development');
                    if (currentFilter === 'mysql') displayed = filtered.filter(c => c.type === 'MySQL');
                    if (currentFilter === 'favorites') displayed = filtered.filter(c => c.isFavorite);

                    document.getElementById('connectionsGrid').innerHTML = displayed.map(conn => `
                        <div class="connection-card">
                            <div class="card-badge ${conn.environment === 'production' ? '' : 'development'}">
                                ${conn.environment === 'production' ? 'PRODUCTION' : 'DEVELOPMENT'}
                            </div>
                            <div class="card-header">
                                <div class="db-avatar ${getStatusClass(conn.connectionStatus)}">
                                    <i class="${getDbIcon(conn.type)}"></i>
                                </div>
                                <div class="db-info">
                                    <h3>${conn.name}</h3>
                                    <p>${conn.type} • ${conn.host}</p>
                                </div>
                            </div>
                            <div class="card-details">
                                <div class="detail-item">
                                    <span class="detail-label">Статус подключения</span>
                                    <span class="detail-value">
                                        <i class="fas fa-circle" style="color: ${conn.connectionStatus === 'online' ? 'var(--success)' : conn.connectionStatus === 'offline' ? 'var(--danger)' : 'var(--warning)'}"></i>
                                        ${getStatusText(conn.connectionStatus)}
                                    </span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">База данных</span>
                                    <span class="detail-value">
                                        <i class="fas fa-database"></i>
                                        ${conn.database}
                                    </span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">Пользователь</span>
                                    <span class="detail-value">
                                        <i class="fas fa-user"></i>
                                        ${conn.username}
                                    </span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">Порт</span>
                                    <span class="detail-value">
                                        <i class="fas fa-plug"></i>
                                        ${conn.port}
                                    </span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">Использовано</span>
                                    <span class="detail-value">
                                        <i class="fas fa-history"></i>
                                        ${formatDate(conn.lastUsed)}
                                    </span>
                                </div>
                            </div>
                            <div class="card-footer">
                                <div class="connection-stats">
                                    <div class="stat-item">
                                        <div class="stat-value">${conn.responseTime}</div>
                                        <div class="stat-label">Время ответа</div>
                                    </div>
                                    <div class="stat-item">
                                        <div class="stat-value">${conn.uptime}</div>
                                        <div class="stat-label">Доступность</div>
                                    </div>
                                    <div class="stat-item">
                                        <div class="stat-value">${conn.connections}</div>
                                        <div class="stat-label">Подключений</div>
                                    </div>
                                </div>
                                <div class="card-actions">
                                    <button class="favorite-action-btn ${conn.isFavorite ? 'active' : ''}" onclick="toggleFavorite(${conn.id})" title="${conn.isFavorite ? 'Убрать из избранного' : 'Добавить в избранное'}">
                                        <i class="${conn.isFavorite ? 'fas' : 'far'} fa-star"></i>
                                    </button>
                                    <button class="action-btn" onclick="pingConnection(${conn.id})" title="Проверить">
                                        <i class="fas fa-satellite-dish"></i>
                                    </button>
                                    <button class="action-btn" onclick="monitorConnection(${conn.id})" title="Мониторинг">
                                        <i class="fas fa-chart-bar"></i>
                                    </button>
                                    <button class="action-btn delete" onclick="removeConnection(${conn.id})" title="Удалить">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `).join('');
                    updateConnectionsCount(displayed);
                }
            }
        });

        document.querySelectorAll('.footer-links a').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const icon = link.querySelector('i').className;
                const text = link.textContent.replace(/[^а-яА-Я\s]/gi, '').trim();
                alert(`📄 ${text}\n\nРаздел в разработке. Функциональность будет доступна в следующем обновлении.`);
            });
        });

        document.querySelectorAll('.stat-card').forEach(card => {
            card.addEventListener('click', function () {
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 150);
            });
        });
    });
</script>
</body>
</html>
